[project]
site_name = "muxtools Documentation & Guide"
site_description = "A somewhat simple guide and autogenerated docs for (vs-)muxtools"
site_url = "https://muxtools.vodes.pw"
repo_url = "https://github.com/Vodes/muxtools-doc"
extra_css = ["stylesheets/extra.css", "stylesheets/onedark-darker.css"]
nav = [
    { "Home" = "index.md" },
    { "Guide" = [
        { "Binary Management" = "guide/binary-management.md" },
        { "External dependencies" = "guide/external-dependencies.md" },
        { "Getting started" = "guide/getting-started.md" },
        { "Video Encoding" = "guide/encode-video.md" },
        { "Audio Encoding" = "guide/encode-audio.md" },
        { "Subtitles & Chapters" = "guide/subtitles-and-chapters.md" },
        { "Muxing & TMDB" = "guide/muxing-tmdb.md" },
        { "Dynamic Dataclasses" = "guide/dynamic-dataclasses.md" },
    ] },
    { "Examples" = [
        { "Example scripts with config" = "examples/scripts-with-config.md" },
        { "Example mux without config" = "examples/random-cyberpunk-mux.md" },
        { "Adapting a subkt project" = "examples/adapt-subkt.md" },
        { "Example encode script" = "examples/sample-encode-script.md" },
    ] },
    { "API Reference" = [
        { "Bitstream filters" = "muxtools/helpers/bitstream_filters.md" },
    ] },
    { "Unrelated Stuff" = [
        { "How to no config issue" = "misc/config-issue.md" },
        { "Wav/PCM Ramblings" = "misc/wav-and-friends.md" },
    ] },
]

[project.theme]


[project.theme.palette]
scheme = "slate"
primary = "teal"
accent = "indigo"

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.markdown_extensions.admonition]

[project.plugins.api-autonav]
modules = [
    ".api-sources/muxtools",
    ".api-sources/vsmuxtools",
    ".api-sources/vodesfunc",
]
nav_section_title = "API Reference"
api_root_uri = "reference"
# This module is documented by the custom page listed in nav.
exclude = ["muxtools.helpers.bsf"]

[project.plugins.api-autonav.module_options.'^muxtools\.audio\.preprocess$']
show_if_no_docstring = true

[project.plugins.api-autonav.module_options.'^muxtools\.audio\.tools$']
show_if_no_docstring = true

[project.plugins.api-autonav.module_options.'^muxtools\.muxing\.tracks$']
inherited_members = true
show_if_no_docstring = true
members = ["_track", "VideoTrack", "VT", "AudioTrack", "AT", "SubTrack", "ST", "Premux", "MkvTrack", "Attachment"]

[project.plugins.api-autonav.module_options.'^muxtools\.subtitle\.basesub$']
members = ["_Line", "ShiftMode", "ASSHeader", "BaseSubFile", "OutOfBoundsMode"]
inherited_members = true

[project.plugins.api-autonav.module_options.'^muxtools\.subtitle\.styles$']
show_if_no_docstring = true
show_signature = false

[project.plugins.api-autonav.module_options.'^muxtools\.subtitle\.sub$']
show_if_no_docstring = true

[project.plugins.api-autonav.module_options.'^muxtools\.utils\.types$']
show_if_no_docstring = true
show_signature = false

[project.plugins.api-autonav.module_options.'^vsmuxtools\.video\.encoders\.base$']
show_if_no_docstring = true
show_signature = false

[project.plugins.api-autonav.module_options.'^vsmuxtools\.video\.encoders\.types$']
show_if_no_docstring = true
show_signature = false

[project.plugins.api-autonav.module_options.'^vsmuxtools\.video\.settings$']
show_if_no_docstring = true
show_signature = false

# Preserve URLs of the former hand-written module pages.
[project.plugins.redirects.redirect_maps]
"muxtools/audio/audioutils.md" = "reference/muxtools/audio/audioutils.md"
"muxtools/audio/encoders.md" = "reference/muxtools/audio/encoders.md"
"muxtools/audio/extractors.md" = "reference/muxtools/audio/extractors.md"
"muxtools/audio/memecoders.md" = "reference/muxtools/audio/memecoders.md"
"muxtools/audio/preprocess.md" = "reference/muxtools/audio/preprocess.md"
"muxtools/audio/tools.md" = "reference/muxtools/audio/tools.md"
"muxtools/chapters.md" = "reference/muxtools/misc/chapters.md"
"muxtools/helpers/mkvpropedit.md" = "reference/muxtools/helpers/propedit.md"
"muxtools/main.md" = "reference/muxtools/main.md"
"muxtools/muxing/mux.md" = "reference/muxtools/muxing/muxer.md"
"muxtools/muxing/tmdb.md" = "reference/muxtools/muxing/tmdb.md"
"muxtools/muxing/tracks.md" = "reference/muxtools/muxing/tracks.md"
"muxtools/subtitle/basesub.md" = "reference/muxtools/subtitle/basesub.md"
"muxtools/subtitle/font.md" = "reference/muxtools/subtitle/font.md"
"muxtools/subtitle/styles.md" = "reference/muxtools/subtitle/styles.md"
"muxtools/subtitle/sub.md" = "reference/muxtools/subtitle/sub.md"
"muxtools/subtitle/sub_pgs.md" = "reference/muxtools/subtitle/sub_pgs.md"
"muxtools/subtitle/subutils.md" = "reference/muxtools/subtitle/subutils.md"
"muxtools/utils/convert.md" = "reference/muxtools/utils/convert.md"
"muxtools/utils/dataclass.md" = "reference/muxtools/utils/dataclass.md"
"muxtools/utils/files.md" = "reference/muxtools/utils/files.md"
"muxtools/utils/formats.md" = "reference/muxtools/utils/formats.md"
"muxtools/utils/glob.md" = "reference/muxtools/utils/glob.md"
"muxtools/utils/probe.md" = "reference/muxtools/utils/probe.md"
"muxtools/utils/types.md" = "reference/muxtools/utils/types.md"
"vodesfunc/denoise.md" = "reference/vodesfunc/denoise.md"
"vodesfunc/misc.md" = "reference/vodesfunc/misc.md"
"vodesfunc/mixed_rescale.md" = "reference/vodesfunc/rescale_ext/mixed_rescale.md"
"vodesfunc/rescale.md" = "reference/vodesfunc/rescale.md"
"vodesfunc/scale.md" = "reference/vodesfunc/scale.md"
"vodesfunc/spikefinder.md" = "reference/vodesfunc/spikefinder.md"
"vodesfunc/util.md" = "reference/vodesfunc/util.md"
"vs-muxtools/extension.md" = "reference/vsmuxtools/extension/index.md"
"vs-muxtools/utils/src.md" = "reference/vsmuxtools/utils/source.md"
"vs-muxtools/video/encoders/base.md" = "reference/vsmuxtools/video/encoders/base.md"
"vs-muxtools/video/encoders/ffmpeg.md" = "reference/vsmuxtools/video/encoders/ffmpeg.md"
"vs-muxtools/video/encoders/intermediary.md" = "reference/vsmuxtools/video/encoders/intermediary.md"
"vs-muxtools/video/encoders/noise.md" = "reference/vsmuxtools/video/encoders/noise.md"
"vs-muxtools/video/encoders/standalone.md" = "reference/vsmuxtools/video/encoders/standalone.md"
"vs-muxtools/video/encoders/types.md" = "reference/vsmuxtools/video/encoders/types.md"
"vs-muxtools/video/hdr/helpers.md" = "reference/vsmuxtools/video/hdr/helpers.md"
"vs-muxtools/video/settings.md" = "reference/vsmuxtools/video/settings.md"
"vs-muxtools/video/testing.md" = "reference/vsmuxtools/video/testing.md"

[project.plugins.mkdocstrings]
custom_templates = "docs/templates"

[project.plugins.mkdocstrings.handlers.python]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://www.vapoursynth.com/doc/objects.inv",
    "https://jaded-encoding-thaumaturgy.github.io/vs-jetpack/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
members_order = "source"
show_if_no_docstring = false
extra = { show_undocumented_if_empty = true }
show_symbol_type_heading = true
show_symbol_type_toc = true
extensions = [{ griffe_pydantic = { schema = true } }]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.footnotes]
